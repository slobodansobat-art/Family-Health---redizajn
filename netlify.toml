# =============================================================================
# Netlify: kako se sajt pravi i objavljuje
# Svaki push na GitHub (ili izmena iz CMS-a) automatski pravi novu verziju.
# =============================================================================
[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# Bezbednosna zaglavlja za sve stranice
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Fontovi, CSS i JS se dugo čuvaju u kešu pregledača (CSS/JS imaju ?v= verziju)
[[headers]]
  for = "/assets/fonti/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Admin (CMS) se ne indeksira
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Preusmerenja sa adresa starog sajta dodati u src/staticno/_redirects
